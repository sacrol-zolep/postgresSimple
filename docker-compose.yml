# Proyecto: Base de Datos PostgreSQL simple
# Version: 1.0
# Proposito: Gestionar una base de datos central.
# Iniciar: podman-compose up -d 

services:

  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: db-central
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - datos_central:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

volumes:
  datos_central:

